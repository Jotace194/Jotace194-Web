<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesión de Twitch Sincronizada</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #user-info {
      margin: 20px auto;
      padding: 15px;
      border: 1px solid #ccc;
      display: inline-block;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #9146FF;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #772ce8;
    }
  </style>
</head>
<body>

  <h1>Control de Sesión de Twitch</h1>
  
  <div id="login-container">
    <p>No has iniciado sesión.</p>
    <!-- Reemplaza CLIENT_ID y REDIRECT_URI con tus datos de la API de Twitch -->
    <button id="loginBtn">Iniciar sesión con Twitch</button>
  </div>

  <div id="user-container" style="display: none;">
    <div id="user-info">
      <h3 id="username"></h3>
      <p id="user-email"></p>
    </div>
    <br>
    <button id="logoutBtn">Cerrar Sesión</button>
  </div>

  <script>
    const CLIENT_ID = 'gcykx8eznq8gex7rgm0ebihs2k9q5h';
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginContainer = document.getElementById('login-container');
    const userContainer = document.getElementById('user-container');
    const usernameEl = document.getElementById('username');

    // 1. Capturar el token de la URL si venimos de la redirección de Twitch (Implicit Grant Flow)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    if (accessToken) {
      // Guardamos el token en localStorage y limpiamos la URL
      localStorage.setItem('twitch_access_token', accessToken);
      window.location.hash = '';
    }

    // 2. Función para obtener datos del usuario desde la API de Twitch
    async function obtenerDatosTwitch(token) {
      try {
        const response = await fetch('https://api.twitch.tv/helix/users', {
          headers: {
            'Client-ID': CLIENT_ID,
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          // Si el token expiró o no es válido, limpiamos
          throw new Error('Token inválido o expirado');
        }

        const data = await response.json();
        const user = data.data[0];

        // Mostrar interfaz de usuario conectado
        usernameEl.textContent = `Hola, ${user.display_name}`;
        loginContainer.style.display = 'none';
        userContainer.style.display = 'block';

      } catch (error) {
        console.error(error);
        handleLogout();
      }
    }

    // 3. Función para limpiar sesión localmente
    function handleLogout() {
      localStorage.removeItem('twitch_access_token');
      loginContainer.style.display = 'block';
      userContainer.style.display = 'none';
      usernameEl.textContent = '';
    }

    // 4. Botón de inicio de sesión
    loginBtn.addEventListener('click', () => {
      const twitchAuthUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=user:read:email`;
      window.location.href = twitchAuthUrl;
    });

    // 5. Botón de cierre de sesión
    logoutBtn.addEventListener('click', () => {
      handleLogout();
    });

    // 6. Inicialización al cargar la página
    const savedToken = localStorage.getItem('twitch_access_token');
    if (savedToken) {
      obtenerDatosTwitch(savedToken);
    } else {
      handleLogout();
    }

    // 7. Sincronización automática entre pestañas
    window.addEventListener('storage', (event) => {
      if (event.key === 'twitch_access_token') {
        if (!event.newValue) {
          // Se cerró sesión en otra pestaña
          handleLogout();
        } else {
          // Se inició sesión en otra pestaña
          obtenerDatosTwitch(event.newValue);
        }
      }
    });
  </script>

</body>
</html>
