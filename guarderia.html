:root{
  --naranja:#FF6600; --naranja-claro:#FF8833; --naranja-oscuro:#CC5200;
  --negro:#030202; --carbon:#0A0808; --carbon-claro:#141111;
  --turquesa:#8AE6DF; --hueso:#F7F2EC; --tenue:#8C827A; 
  --twitch-purple:#9146FF; --twitch-hover:#772ce8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--negro);color:var(--hueso);font-family:'Segoe UI',sans-serif;line-height:1.7}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px}

.navbar{position:fixed;top:0;left:0;width:100%;z-index:1000;background:rgba(3,2,2,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,102,0,.15)}
.nav-wrap{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:70px}
.nav-logo img{height:40px;width:40px;object-fit:cover;border-radius:50%;border:2px solid var(--naranja)}
.nav-links{display:flex;gap:26px;align-items:center;list-style:none}
.nav-links a{font-size:.9rem;color:var(--tenue);font-weight:600;text-decoration:none;transition:color .2s ease}
.nav-links a:hover, .nav-links a.active{color:var(--naranja-claro)}
.nav-toggle{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px}
.nav-toggle span{display:block;width:25px;height:2px;background:var(--hueso)}

.salon-header{position:relative;padding:130px 0 50px;text-align:center;min-height:260px;overflow:hidden}
.salon-tag{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--naranja);font-weight:700}
.salon-header h1{font-size:clamp(2.3rem,5vw,3.6rem);font-weight:900;color:var(--hueso);margin:6px 0 10px}
.salon-header p{color:var(--tenue);max-width:600px;margin:0 auto}

.game-container{padding:10px 0 60px;}
.hidden{display:none !important;}

.auth-box{background:var(--carbon);border:1px solid rgba(255,102,0,0.3);border-radius:16px;padding:40px;text-align:center;max-width:450px;margin:40px auto;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.btn-twitch{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--twitch-purple);color:white;border:none;width:100%;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;transition:background 0.2s, transform 0.2s;text-decoration:none;margin-top:20px;}
.btn-twitch:hover{background:var(--twitch-hover);transform:translateY(-2px);}

.user-hud{display:flex;justify-content:space-between;align-items:center;background:var(--carbon);border:1px solid rgba(255,102,0,0.2);padding:16px 24px;border-radius:12px;margin-bottom:25px;flex-wrap:wrap;gap:15px;}
.hud-profile{display:flex;align-items:center;gap:12px;}
.hud-profile img{width:45px;height:45px;border-radius:50%;border:2px solid var(--twitch-purple);object-fit:cover;}
.hud-info h3{color:var(--naranja-claro);font-size:1.1rem;}
.hud-stats{display:flex;gap:15px;font-weight:700;flex-wrap:wrap;}
.stat-badge{background:var(--carbon-claro);padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.05);color:var(--turquesa);}

.game-section-card{background: var(--carbon); border: 1px solid rgba(255,102,0,0.2); border-radius: 16px; padding: 30px; margin-bottom: 25px;}

.egg-selection-grid {display: flex; justify-content: center; margin-top: 15px;}
.egg-option-card {background: var(--carbon-claro); border: 1px solid rgba(255,102,0,0.3); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; max-width: 250px; width: 100%;}
.egg-option-card:hover {border-color: var(--naranja); transform: translateY(-4px);}
